<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الورد الأنيق - اتصل بنا</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>متجر الورد الأنيق</h1>
        <p>يسعدنا تواصلك معنا في أي وقت</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="about-us.html">من نحن</a></li>
             <li><a href="contact-us.html">اتصل بنا</a></li>
            <li><a href="customize.html">تصميم باقتك (طلب خاص)</a></li>
        </ul>
    </nav>

    <main>
        <section class="form-section">
            <h2>نموذج التواصل</h2>
            <form action="#" method="POST">
                
                <div class="form-group">
                    <label for="fname">الاسم الأول:</label>
                    <input type="text" id="fname" name="firstname" required maxlength="20">
                </div>

                <div class="form-group">
                    <label for="lname">الاسم الأخير:</label>
                    <input type="text" id="lname" name="lastname" required maxlength="20">
                </div>

                <div class="form-group">
                    <label>الجنس:</label>
                    <label class="radio-label"><input type="radio" name="gender" value="male" required> ذكر</label>
                    <label class="radio-label"><input type="radio" name="gender" value="female"> أنثى</label>
                </div>

                <div class="form-group">
                    <label for="phone">رقم الجوال:</label>
                    <input type="tel" id="phone" name="mobile" placeholder="05xxxxxxxx" required pattern="[0-5]{2}[0-9]{8}">
                </div>

                <div class="form-group">
                    <label for="dob">تاريخ الميلاد:</label>
                    <input type="date" id="dob" name="birthdate" required>
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="lang">لغة التواصل المفضلة:</label>
                    <select id="lang" name="language" required>
                        <option value="">اختر اللغة...</option>
                        <option value="ar">العربية</option>
                        <option value="en">الإنجليزية</option>
                        <option value="fr">الفرنسية</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="msg">رسالتك:</label>
                    <textarea id="msg" name="message" rows="5" required placeholder="اكتب استفسارك هنا..."></textarea>
                </div>

                <button type="submit" class="btn">إرسال الرسالة</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة لطلاب جامعة جدة - قسم هندسة البرمجيات.</p>
    </footer>

</body>
</html>
